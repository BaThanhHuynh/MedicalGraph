<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern AI Chatbot</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</head>
<body>
    <div class="app-container">
        <div class="chat-card">
            <header class="chat-header">
                <div class="status-dot"></div>
                <div class="header-text">
                    <h2>AI Assistant</h2>
                    <span>Hệ thống đang hoạt động</span>
                </div>
            </header>

            <main class="chat-body" id="chat-body">
                <div class="msg bot">
                    <div class="bubble">Chào bạn! Tôi có thể hỗ trợ gì cho dự án của bạn hôm nay?</div>
                </div>
            </main>

            <footer class="chat-footer">
                <div class="input-wrapper">
                    <input type="text" id="user-input" placeholder="Hỏi tôi bất cứ điều gì..." autocomplete="off">
                    <button id="send-btn">
                        <svg viewBox="0 0 24 24" width="24" height="24">
                            <path fill="currentColor" d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path>
                        </svg>
                    </button>
                </div>
            </footer>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
